port: 7880
bind_addresses:
  - ""

rtc:
  port_range_start: 50000
  port_range_end: 50100
  node_ip: 127.0.0.1
  use_external_ip: false

redis:
  address: redis:6379

# LiveKit server rejects secrets shorter than 32 characters (non-dev builds).
keys:
  APIKeyDevKey: dev_livekit_api_secret_minimum_32_chars_x

webhook:
  api_key: APIKeyDevKey
  urls:
    - http://backend:8000/api/conversation/webhook/

logging:
  level: info

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 20
