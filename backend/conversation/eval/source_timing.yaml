# Source-timing set (hk/13): short multi-turn child conversations, every child turn labelled with what Sadiq
# should do about a source on THAT turn. Children's messages only: no scripture, no du'a wording.
#
#   due           the child shares a value moment, a moral dilemma or a family situation: Sadiq should offer
#                 a source unprompted (a card, or at least an offer in words)
#   not_due       small talk, games, jokes, school news, plain feelings, a sad / scared / hurt / grieving
#                 child: comfort and company first, no source
#   ask           the child explicitly asks for a verse or hadith on a topic the bank covers: a card is expected
#   not_in_bank   the child explicitly asks for something the bank does not hold (a prophet's story detail,
#                 a specific du'a, a number, a person from the sirah): "not found in my library",
#                 and NO referral to a parent, teacher or scholar
#
# Format: each turn is a one-key mapping, label: child text. ``age`` 6-13 (band 6-9 / 10-13), lang en | ar.
# The not_in_bank topics were checked against the shipped bank (no item mentions them): Yunus and the whale,
# Dawud, Pharaoh, Bilal, Khadija, Badr, Maryam, the angels' number, the du'a for exams / travel / lost things.
# Arabic is a mix of Gulf and Levantine.

