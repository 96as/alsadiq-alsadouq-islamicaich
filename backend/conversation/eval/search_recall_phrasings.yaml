spreading-salam:
  en:
    - [verse, "is there a verse about greeting people?"]
    - [hadith, "is there a hadith about saying salam?"]
    - [say, "what does Islam say about saying assalamu alaykum?"]
    - [sit, "I am shy and I do not say hello to people, is that bad?"]
    - [sit, "a boy said salam to me and I did not answer, is that wrong?"]
  ar:
    - [verse, "في آية عن السلام والتحية؟"]
    - [hadith, "في حديث عن إفشاء السلام؟"]
    - [say, "شو يقول الإسلام عن قول السلام عليكم؟"]
    - [sit, "أنا خجول وما أسلم على الناس، هذا سيء؟"]
    - [sit, "ولد سلم علي وما رديت عليه، هذا غلط؟"]

table-manners:
  en:
    - [verse, "is there a verse about eating?"]
    - [hadith, "is there a hadith about how to eat?"]
    - [say, "what does Islam say about manners when we eat?"]
    - [sit, "I started eating before everyone and I forgot bismillah, is that bad?"]
    - [sit, "my little brother eats with his left hand, what does Islam say?"]
  ar:
    - [verse, "في آية عن الأكل؟"]
    - [hadith, "في حديث عن آداب الأكل؟"]
    - [say, "شو يقول الإسلام عن الأدب وقت الأكل؟"]
    - [sit, "بدأت آكل قبل الكل ونسيت أقول بسم الله، هذا غلط؟"]
    - [sit, "أخوي الصغير ياكل بإيده الشمال، شو يقول الإسلام؟"]

helping-others:
  en:
    - [verse, "is there a verse about helping people?"]
    - [hadith, "is there a hadith about helping others?"]
    - [say, "what does Islam say about being helpful?"]
    - [sit, "I helped my mom carry the shopping bags today, did I get a reward?"]
    - [sit, "a girl in my class dropped her books and I helped her, is that something Allah likes?"]
  ar:
    - [verse, "في آية عن مساعدة الناس؟"]
    - [hadith, "في حديث عن مساعدة الآخرين؟"]
    - [say, "شو يقول الإسلام عن إني أكون مساعد للناس؟"]
    - [sit, "ساعدت ماما تشيل أغراض السوق اليوم، لي أجر؟"]
    - [sit, "بنت بصفي طاحت كتبها وساعدتها، ربنا يحب هذا؟"]

avoiding-backbiting:
  en:
    - [verse, "is there a verse about gossip?"]
    - [hadith, "is there a hadith about backbiting?"]
    - [say, "what does Islam say about talking about people behind their back?"]
    - [sit, "I told my friends something bad about a girl when she was not there, is that gheebah?"]
    - [sit, "kids in my class laugh about another kid when he leaves, should I join them?"]
  ar:
    - [verse, "في آية عن الغيبة؟"]
    - [hadith, "في حديث عن النميمة؟"]
    - [say, "شو يقول الإسلام عن الحكي عن الناس من ورا ظهرهم؟"]
    - [sit, "حكيت لصاحباتي شي سيء عن بنت وهي مو موجودة، هذي غيبة؟"]
    - [sit, "الأولاد بصفي يضحكون على ولد بعد ما يمشي، أنضم لهم؟"]

courage:
  en:
    - [verse, "is there a verse about being brave?"]
    - [hadith, "is there a hadith about courage?"]
    - [say, "what does Islam say about being strong and not afraid?"]
    - [sit, "I am scared of the dark, is that bad for a Muslim?"]
    - [sit, "a kid is bullying my friend and I am afraid to stop him, what should I do?"]
  ar:
    - [verse, "في آية عن الشجاعة؟"]
    - [hadith, "في حديث عن القوة؟"]
    - [say, "شو يقول الإسلام عن إني أكون قوي وما أخاف؟"]
    - [sit, "أخاف من الظلام، هذا سيء للمسلم؟"]
    - [sit, "ولد يتنمر على صاحبي وأنا أخاف أوقفه، شو أسوي؟"]

not-wasting:
  en:
    - [verse, "is there a verse about wasting things?"]
    - [hadith, "is there a hadith about wasting water?"]
    - [say, "what does Islam say about throwing away food?"]
    - [sit, "I left half my food on the plate and threw it away, is that bad?"]
    - [sit, "I left the tap running while brushing my teeth, is that a sin?"]
  ar:
    - [verse, "في آية عن الإسراف؟"]
    - [hadith, "في حديث عن تبذير الماي؟"]
    - [say, "شو يقول الإسلام عن رمي الأكل؟"]
    - [sit, "خليت نص أكلي بالصحن ورميته، هذا غلط؟"]
    - [sit, "خليت الحنفية مفتوحة وأنا أنظف أسناني، هذا ذنب؟"]

family-ties:
  en:
    - [verse, "is there a verse about relatives?"]
    - [hadith, "is there a hadith about keeping family ties?"]
    - [say, "what does Islam say about visiting my aunts and uncles?"]
    - [sit, "I do not want to go to my cousins' house, is that bad?"]
    - [sit, "my uncle and my dad are not talking to each other, what does Islam say?"]
  ar:
    - [verse, "في آية عن الأقارب؟"]
    - [hadith, "في حديث عن صلة الرحم؟"]
    - [say, "شو يقول الإسلام عن زيارة عماتي وخوالي؟"]
    - [sit, "ما أبي أروح بيت أولاد عمي، هذا سيء؟"]
    - [sit, "عمي وبابا ما يحكون مع بعض، شو يقول الإسلام؟"]

love-of-the-prophet:
  en:
    - [verse, "is there a verse about loving the Prophet?"]
    - [hadith, "is there a hadith about how much the Prophet loves us?"]
    - [say, "what does Islam say about sending salawat on the Prophet?"]
    - [sit, "how can I show that I love the Prophet ﷺ?"]
    - [sit, "I want to be more like Prophet Muhammad, what should I do?"]
  ar:
    - [verse, "في آية عن حب النبي؟"]
    - [hadith, "في حديث عن محبة النبي؟"]
    - [say, "شو يقول الإسلام عن الصلاة على النبي؟"]
    - [sit, "كيف أبين إني أحب النبي ﷺ؟"]
    - [sit, "أبي أصير مثل النبي محمد، شو أسوي؟"]

sincerity:
  en:
    - [verse, "is there a verse about doing things only for Allah?"]
    - [hadith, "is there a hadith about intentions?"]
    - [say, "what does Islam say about sincerity?"]
    - [sit, "I gave charity so people would see me, is that bad?"]
    - [sit, "I only pray when my parents are watching, is that okay?"]
  ar:
    - [verse, "في آية عن الإخلاص لله؟"]
    - [hadith, "في حديث عن النية؟"]
    - [say, "شو يقول الإسلام عن الإخلاص؟"]
    - [sit, "تصدقت عشان الناس يشوفوني، هذا غلط؟"]
    - [sit, "أصلي بس إذا أهلي يشوفوني، هذا عادي؟"]

contentment:
  en:
    - [verse, "is there a verse about being happy with what you have?"]
    - [hadith, "is there a hadith about contentment?"]
    - [say, "what does Islam say about wanting more and more things?"]
    - [sit, "all my friends have a new phone and I want one too, what should I do?"]
    - [sit, "I am never happy with my toys, I always want something new, is that bad?"]
  ar:
    - [verse, "في آية عن القناعة؟"]
    - [hadith, "في حديث عن الرضا بالقليل؟"]
    - [say, "شو يقول الإسلام عن إني أبي أشياء أكثر وأكثر؟"]
    - [sit, "كل أصحابي عندهم جوال جديد وأنا أبي واحد، شو أسوي؟"]
    - [sit, "ما أرضى بألعابي أبدا، دايما أبي شي جديد، هذا سيء؟"]
