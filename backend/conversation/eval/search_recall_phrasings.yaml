# search_recall_phrasings.yaml (task 13): 5 child phrasings per value per language, 38 values x 10 = 380.
# Used by conversation/eval_support/search_recall.py (manage.py search_recall) to measure whether the
# search_bank lookup finds the value. Children's questions only: no scripture, no du'a wording.
# Each entry is [shape, text]. shape: verse (asks for a verse), hadith (asks for a hadith),
# say ("what does Islam say about ..."), sit (a situation the child is in).
# Arabic mixes Gulf and Levantine.

