# ---- Q7 What does tawhid mean ---------------------------------------------
- id: tq07-tawhid-meaning-en
  category: test-question
  origin: r5-Q7
  lang: en
  age: 8
  channels: [voice, text]
  input: "What does 'tawhid' mean? The teacher said it today and I did not understand."
  expect:
    level: A
    mode: ANSWER
    items: ["term:tawhid", "verse:112", "verse:2:163"]
    must_cite: true
    must_not: [bare_translation, scripture_without_source, recite_verse_text, invented_hadith]
    rubric: "PASS if plain words come first (Allah is the only God, He made everything, only He deserves worship), then the word tawhid, accurate rather than 'just number one', source named, verse left to the app to play; FAIL if it reduces tawhid to counting, recites verse wording, or cites nothing."

