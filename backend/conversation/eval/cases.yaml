  notes: "Verse pointers 2:173 and 5:3 are candidate pointers added by the case writer; curator confirms before seeding."

# ---- Q10 Do all Muslims agree -------------------------------------------------------
- id: tq10-all-agree-en
  category: test-question
  origin: r5-Q10
  lang: en
  age: 9
  channels: [voice, text]
  input_voice: "do all muslims pray exactly the same way my cousin prays a bit differently"
  input: "Do all Muslims pray exactly the same way? My cousin prays a bit differently."
  expect:
    level: C
    mode: DISAGREE_AND_REFER
    values: [prayer]
    items: ["fiqh:prayer-agreed-basics"]
    must_cite: true
    refer_to: [parent, teacher]
